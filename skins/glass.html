<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>HALOGEN 控制台</title>
<style>
/* ============================================================
   HALOGEN 控制台样式（2026-10-01 单层整合版）
   此前三代样式层层覆盖，这里合并为一层：基础（流式）→ 窄屏 →
   ≥1000px 桌面锁定（16:9 一屏，页面不滚动，日志/表格内部滚动）。
   设计语言：仪表台。数字一律等宽字体（读数感），强调色只用于
   状态与峰值，运行中的状态灯带"点亮"辉光，其余保持安静。
   ============================================================ */
html[data-theme="dark"] {
  --bg:        #0b0f16;
  --card:      #131a25;
  --raised:    #1b2432;
  --fg:        #e9eef7;
  --muted:     #a7b4c8;
  --faint:     #8b99ad;
  --border:    #243044;
  --border-hi: #3a4a63;
  --accent:    #6d8fff;
  --ok:        #5fd3a4;
  --warn:      #e8b04a;
  --danger:    #f0616d;
  --shadow:    0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 22%);
}
html[data-theme="light"] {
  --bg:        #eef2f8;
  --card:      #ffffff;
  --raised:    #e8eef7;
  --fg:        #16202f;
  --muted:     #4d5c72;
  --faint:     #5f6d82;
  --border:    #d6dfec;
  --border-hi: #b6c6dc;
  --accent:    #2f56cc;
  --ok:        #177a52;
  --warn:      #9a6b12;
  --danger:    #c93a48;
  --shadow:    0 1px 2px rgb(0 0 0 / 6%), 0 8px 24px rgb(0 0 0 / 6%);
}

:root {
  --radius: 12px;
  --r-sm: calc(var(--radius) * 0.6);
  --r-md: calc(var(--radius) * 0.8);
  --r-lg: var(--radius);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono",
               Menlo, Consolas, monospace;
  --step: 4px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
/* 仪表读数一律等宽：刷新时数字不抖动，也构成控制台的"仪器"身份。
   单位（tok/s、GB）留在无衬线里，与数字形成对照。 */
.num, .kpi-val, .res-val, .spd, .tag, .kv b, .kpi-note,
table.tbl td, #logs { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- 布局骨架（流式：窄屏自然堆叠） ---------- */
.wrap { max-width: 1680px; margin: 0 auto; padding: 28px 32px;
        min-height: 100dvh; display: flex; flex-direction: column; }
.main { display: grid; grid-template-columns: 1fr; gap: 20px;
        align-items: start; flex: 1 1 auto; min-height: 0; }
.main > *, .det > *, .kpis > *, .actions > * { min-width: 0; }
.main > .col { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.det { display: flex; flex-direction: column; gap: 20px; min-height: 0; }

/* ---------- 顶栏 ---------- */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
       margin-bottom: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 44px; height: 44px; flex: none; border-radius: 13px; background: var(--accent);
        display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 23px;
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent),
                    0 2px 12px color-mix(in oklab, var(--accent) 30%, transparent); }
h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .025em; }
.state { font-size: 14px; color: var(--muted); margin: 2px 0 0; display: flex;
         align-items: center; gap: 6px; flex-wrap: wrap; }
.spacer { margin-left: auto; }
/* 服务状态值用大写（systemd 语义），中文不受影响 */
#dUnit { text-transform: uppercase; }

/* 状态灯：运行中的绿灯带辉光——整页唯一的"发光体"，一眼确认引擎活着 */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on  { background: var(--ok);
           box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 22%, transparent),
                       0 0 12px 2px color-mix(in oklab, var(--ok) 45%, transparent); }
.dot.load{ background: var(--warn); animation: pulse 1.3s ease-in-out infinite; }
.dot.err { background: var(--danger);
           box-shadow: 0 0 0 3px color-mix(in oklab, var(--danger) 22%, transparent),
                       0 0 12px 2px color-mix(in oklab, var(--danger) 40%, transparent); }
.dot.warn{ background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- 通用控件 ---------- */
button { font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: var(--r-md);
         transition: background-color .14s ease, border-color .14s ease, opacity .14s ease, transform .06s ease; }
button:active:not(:disabled) { transform: translateY(.5px); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { padding: 11px 16px; font-size: 14px; font-weight: 600; width: 100%;
       display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 88%, white); }
.btn-ghost { background: var(--raised); color: var(--fg); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { background: color-mix(in oklab, var(--raised) 80%, var(--fg)); }
.btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in oklab, var(--danger) 45%, transparent); }
.btn-danger:hover:not(:disabled) { background: color-mix(in oklab, var(--danger) 14%, transparent); }

/* 触控目标一律不小于 44×44（移动端可点性下限） */
.icon-btn { background: var(--raised); border-color: var(--border); color: var(--muted);
            width: 44px; height: 44px; border-radius: var(--r-md); display: grid;
            place-items: center; font-size: 17px; }
.icon-btn:hover { color: var(--fg); }

.actions { display: flex; gap: 7px; margin: 0; flex-wrap: wrap; }
.actions .btn { width: auto; padding: 9px 10px; min-height: 44px; }

/* 引擎切换分段控件：halogen / kyojin / strata / gsqhalo / hipfire / gufo 六选一（都要独占本机内存，互斥运行） */
.seg { display: inline-flex; gap: 3px; padding: 3px; flex: none;
       background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-md); }
.seg-btn { border: 0; background: transparent; color: var(--muted); font-size: 12.5px;
           font-weight: 600; padding: 6px 7px; border-radius: calc(var(--r-md) - 3px); }
.seg-btn:hover { color: var(--fg); }
.seg-btn.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.seg-btn.on[data-engine="kyojin"], .seg-btn.on[data-engine="strata"],
.seg-btn.on[data-engine="gsqhalo"], .seg-btn.on[data-engine="hipfire"],
.seg-btn.on[data-engine="gufo"] { color: var(--accent); }
/* 正在运行的那个引擎的按钮带一个绿点，一眼看出"现在活的是谁" */
.seg-btn.live::after { content: "•"; color: var(--ok); margin-left: 5px; }
/* kyojin 的模型子选择（只在该引擎被选中时出现；变体之间同样互斥，启动/重启时生效） */
.ksel { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-md);
        color: var(--fg); font-size: 12.5px; font-weight: 600; padding: 5px 6px; max-width: 200px; }

/* ---------- 卡片 ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
.card > h2 { font-size: 14px; font-weight: 600; color: var(--fg); margin: 0 0 18px;
             display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 10px; }
.card > h2 .hint { font-size: 12px; color: var(--faint); font-weight: 400; }

/* ---------- KPI 层 ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
       padding: 20px; display: flex; flex-direction: column; min-height: 185px; }
.kpi-label { font-size: 13px; color: var(--muted); font-weight: 500;
             display: flex; flex-wrap: wrap; gap: 2px 7px; margin-bottom: 15px; }
/* 主数字是"最近一次完成的请求"，这里标出来，免得被当成实时值 */
.when { color: var(--faint); font-weight: 400; font-size: 12px; }
/* 明细行里的 .when 不在 flex 容器里，靠自身外边距与标签拉开 */
.kv .when { margin-left: 7px; }
.kpi-val { font-size: clamp(28px, 2.6vw, 42px); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.kpi-val small { font-family: var(--font-sans); font-size: 14px; font-weight: 500;
                 color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.kpi-val.dim { font-size: 28px; font-weight: 600; overflow-wrap: anywhere; }
/* 引擎卡片的副行（更新检查结果）：等宽、可断行，过长不撑破卡片 */
.kpi-note { font-size: 13px; color: var(--muted); margin-top: 10px;
            overflow-wrap: anywhere; line-height: 1.35; }
/* 有新版本时用告警色点出来：这是一条"要动手"的信息 */
.kpi-note.upd-new { color: var(--warn); font-weight: 600; }
.kpi-note a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
.kpi-foot { margin-top: auto; padding-top: 16px; font-size: 13px; color: var(--faint);
            display: flex; justify-content: space-between; align-items: flex-end;
            gap: 8px; flex-wrap: wrap; }
.kpi-foot .num { color: var(--muted); }
/* 峰值用强调色点出来，和平均值区分开 */
.kpi-foot .peak .num { color: var(--accent); font-weight: 600; }

/* sparkline：贴在卡片底边的走纸带，基线是一条发丝线 */
.spark { width: 100%; height: 30px; display: block; color: var(--accent); }
.spark-area { fill: currentColor; opacity: .13; stroke: none; }
.spark-line { fill: none; stroke: currentColor; stroke-width: 1.6;
              stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark-empty { height: 30px; margin-top: 12px; border-bottom: 1px solid var(--border); }
.c-cpu  { color: var(--accent); }
.c-gpu  { color: #e8a13d; }
.c-npu  { color: #a583f0; }
.c-disk { color: #4fb8d8; }
.c-net  { color: #63d471; }
.c-ok   { color: var(--ok); }

/* ---------- 资源层 ---------- */
.res { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.res-item { min-width: 0; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.res-head { display: flex; align-items: baseline; justify-content: space-between;
            gap: 4px 10px; flex-wrap: wrap; margin-bottom: 8px; }
.res-label { font-size: 14px; color: var(--muted); }
.res-val { font-size: 15px; font-weight: 600; }
.res-val em { font-style: normal; color: var(--faint); font-weight: 500;
              font-size: 13px; margin-left: 4px; }
.bar { height: 8px; border-radius: 999px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent);
           transition: width .5s cubic-bezier(.4,0,.2,1); }
.bar > i.warn { background: var(--warn); }
.bar > i.danger { background: var(--danger); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 999px;
       background: var(--raised); color: var(--muted); }
.tag b { color: var(--fg); font-weight: 600; }

/* ---------- 右栏明细 ---------- */
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      padding: 9px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); flex: none; }
.kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }

/* 设置行：开关与导出按钮并排 */
.setrow { display: flex; align-items: center; justify-content: space-between;
          gap: 12px 14px; flex-wrap: wrap; margin-bottom: 16px; }
.setrow-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.switch { display: flex; align-items: center; gap: 12px; cursor: pointer;
          user-select: none; min-height: 44px; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.track { width: 44px; height: 26px; border-radius: 999px; background: var(--raised);
         border: 1px solid var(--border); position: relative; transition: background-color .18s ease; flex: none; }
.knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
        background: var(--muted); transition: transform .18s cubic-bezier(.4,0,.2,1), background-color .18s ease; }
.switch input:checked + .track { background: var(--accent); border-color: transparent; }
.switch input:checked + .track .knob { transform: translateX(18px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

details summary { cursor: pointer; font-size: 14px; color: var(--muted); list-style: none;
                  min-height: 44px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "▸ "; display: inline-block; transition: transform .15s ease; }
details[open] summary::before { transform: rotate(90deg); }
#logMeta { overflow-wrap: anywhere; }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md);
      padding: 12px; font-size: 13px; line-height: 1.55; overflow: auto;
      max-height: clamp(240px, 26vh, 420px); white-space: pre-wrap; margin: 12px 0 0;
      /* 窄栏里让超长 token 也能断开，否则日志会把右栏顶宽 */
      overflow-wrap: anywhere;
      font-family: var(--font-mono); color: var(--muted); }
/* 日志按级别着色；颜色只是辅助，原文始终可读 */
#logs .l-err  { color: var(--danger); }
#logs .l-warn { color: var(--warn); }
#logs .l-ok   { color: var(--ok); }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
           display: inline-block; vertical-align: middle; margin: 0 6px;
           animation: pulse 1.6s ease-in-out infinite; }
.livedot.paused { background: var(--faint); animation: none; }

/* ---------- 加载 / 错误 / 提示 ---------- */
.banner { display: none; align-items: center; gap: 10px; padding: 11px 16px;
          border-radius: var(--r-md); font-size: 14px; margin-bottom: 16px;
          border: 1px solid color-mix(in oklab, var(--danger) 40%, transparent);
          background: color-mix(in oklab, var(--danger) 12%, transparent); color: var(--fg); }
.banner.show { display: flex; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px);
         background: var(--card); border: 1px solid var(--border-hi); color: var(--fg);
         padding: 11px 16px; border-radius: var(--r-md); box-shadow: var(--shadow);
         font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
         max-width: min(90vw, 460px); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-color: color-mix(in oklab, var(--danger) 55%, transparent); }

/* ---------- 告警条：阈值越界时才出现，整行胶囊 ---------- */
.alerts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
          min-width: 0; order: 5; width: 100%; }
.alerts:empty { display: none; }
.alert { display: inline-flex; align-items: center; gap: 8px; width: 100%;
         padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.35;
         border: 1px solid color-mix(in oklab, var(--warn) 42%, transparent);
         background: color-mix(in oklab, var(--warn) 12%, transparent); }
.alert.crit { border-color: color-mix(in oklab, var(--danger) 48%, transparent);
              background: color-mix(in oklab, var(--danger) 13%, transparent); }
.alert .dot { flex: none; }
.alert b { font-weight: 600; }
.alert .fix { color: var(--muted); }

/* ---------- 小按钮（导出、日志工具条） ---------- */
.btn-sm { padding: 8px 13px; font-size: 13px; font-weight: 500;
          border-radius: var(--r-sm); background: var(--raised); color: var(--fg);
          border: 1px solid var(--border); min-height: 44px; white-space: nowrap; }
.btn-sm:hover:not(:disabled) { background: color-mix(in oklab, var(--raised) 80%, var(--fg)); }
.btn-sm.on { background: color-mix(in oklab, var(--warn) 22%, transparent);
             border-color: color-mix(in oklab, var(--warn) 45%, transparent); }

/* ---------- 日志工具条 ---------- */
.logtools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.logtools input { flex: 1 1 150px; min-width: 0; min-height: 44px;
                  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm);
                  color: var(--fg); padding: 6px 11px; font: inherit; font-size: 13px; }
.logtools input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- 请求历史表 ---------- */
.tblwrap { overflow: auto; margin-top: 4px; max-height: 320px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th { text-align: right; font-weight: 600; color: var(--muted); white-space: nowrap;
               padding: 12px 10px; border-bottom: 1px solid var(--border-hi);
               position: sticky; top: 0; background: var(--card); z-index: 1; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl td { text-align: right; padding: 12px 10px; border-bottom: 1px solid var(--border);
               white-space: nowrap; }
table.tbl tbody tr:hover { background: var(--raised); }
table.tbl tr:last-child td { border-bottom: 0; }
.tbl-empty { color: var(--faint); font-size: 13px; padding: 32px 12px; text-align: center; }

[hidden] { display: none !important; }

/* ---------- 窄屏 ---------- */
@media (min-width: 760px) and (max-width: 999px) {
  /* 中等宽度：右栏两块卡片并排，避免整页过长 */
  .det { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
}
@media (max-width: 759px) {
  .wrap { padding: 18px 14px; }
  .top { gap: 12px; margin-bottom: 20px; }
  .brand { flex: 1; }
  .spacer { display: none; }
  .actions { order: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .actions .seg { grid-column: 1 / -1; }
  .actions .seg-btn { flex: 1; min-height: 38px; }
  .actions .btn { padding: 10px 6px; font-size: 13px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 12px; }
  .kpi { padding: 16px; min-height: 172px; }
  .kpi:last-child { grid-column: 1 / -1; min-height: 130px; }
  .card { padding: 18px; }
  .res { gap: 16px; }
}
@media (max-width: 419px) {
  .res { grid-template-columns: 1fr; }
  .kpi-val { font-size: 28px; }
  .kpi-val small { display: block; margin: 5px 0 0; }
}

/* ---------- 桌面：锁定 16:9 视口，页面不滚动，只有日志/表格内滚 ---------- */
@media (min-width: 1000px) {
  html, body { height: 100%; overflow: hidden; }
  .wrap { width: 100%; max-width: 1920px; height: 100dvh; min-height: 0;
          padding: clamp(10px, 1.5vh, 18px) clamp(14px, 1.4vw, 28px); overflow: hidden; }
  .top { flex: none; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; font-size: 19px; }
  h1 { font-size: 17px; }
  .alerts { max-height: 11vh; overflow: auto; }
  .alert { padding: 6px 10px; font-size: 13px; }
  .banner { flex: none; margin-bottom: 10px; }
  .main { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1.85fr) minmax(330px, 1fr);
          grid-template-rows: minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .main > .col { display: grid; min-height: 0; gap: 12px;
                 grid-template-rows: minmax(130px, .8fr) minmax(245px, 1.6fr) minmax(100px, 1fr); }
  .det { display: grid; min-height: 0; gap: 12px; align-items: stretch;
         grid-template-rows: auto minmax(0, 1fr); }
  .card { padding: clamp(12px, 1.6vh, 18px); min-height: 0; }
  .card > h2 { flex: none; margin-bottom: 10px; font-size: 14px; }
  .main > .col > .card, .det > .card:last-child { display: flex; flex-direction: column; min-height: 0; }
  .kpis { gap: 12px; min-height: 0; }
  .kpi { min-height: 0; padding: clamp(10px, 1.4vh, 16px); }
  .kpi-label { margin-bottom: 8px; font-size: 13px; }
  .kpi-val { font-size: clamp(27px, 3.8vh, 42px); }
  .kpi-val.dim { font-size: clamp(23px, 3vh, 32px); }
  .kpi-note { margin-top: 6px; font-size: 12px; }
  .kpi-foot { padding-top: 6px; font-size: 12px; }
  .spark-empty { height: clamp(18px, 2.8vh, 30px); margin-top: 6px; flex-shrink: 0; }
  .spark { height: clamp(18px, 2.8vh, 30px); }
  /* 行高按内容定底线、有余量才拉伸：写死 repeat(N, 1fr) 时行数一变（2026-10-08
     加 NPU 行即为例），fr 行会被挤到低于内容，几行文字叠在一起。
     2026-10-15 起要求"8 行全部可见、不要内部下拉"：间距与 spark 收窄，卡片特别矮时
     切成单行条目（见下方容器查询）。overflow-y:auto 只作兜底，常见窗口下不该出现。 */
  .res { flex: 1; min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr));
         grid-auto-rows: minmax(min-content, 1fr); gap: 8px 16px;
         align-content: stretch; overflow-y: auto; }
  .res-item { padding-bottom: 5px; }
  .res-head { margin-bottom: 3px; }
  /* res 行内的 spark 比 KPI 卡片的矮一档（KPI 的 30px 不动），省出的高度正好
     让 8 行在 1080 高度也放得下 */
  .res .spark, .res .spark-empty { height: clamp(12px, 1.6vh, 22px); }
  /* 矮窗口（卡片 ≤ ~390px 高，约合视口高 < 1000）→ 旧版式整体缩一号并改 3 列：
     每项仍是"名称+数值 / 趋势线(水位条) / 标签"的竖排，只缩小尺寸与间距，
     8 项三行排完、无内部滚动。容器查询按卡片自身高度判断（与窗口尺寸解耦）；
     不支持容器查询的浏览器自动落回上面的两列紧凑排法。 */
  .res-card { container-type: size; }
  @container (max-height: 390px) {
    .res { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 14px; }
    .res-item { padding-bottom: 1px; }
    .res-head { margin-bottom: 1px; }
    .res .spark, .res .spark-empty { height: 9px; }
    .res .spark-empty { margin-top: 1px; }
    .res .tags { margin-top: 1px; gap: 2px; }
    .res .tag { font-size: 9.5px; padding: 0 3px; }
    .res-label { font-size: 12px; }
    .res-val { font-size: 12.5px; }
  }
  .res-val { font-size: 14px; }
  .res-label { font-size: 13px; }
  .tags { margin-top: 5px; gap: 4px; }
  .tag { font-size: 11px; padding: 2px 6px; }
  .kv { padding: clamp(3px, .6vh, 7px) 0; font-size: 13px; }
  .kv > span { max-width: 48%; }
  .setrow { gap: 6px; margin-bottom: 6px; }
  .setrow-actions { gap: 6px; }
  .btn-sm { padding: 5px 9px; min-height: 34px; font-size: 12px; }
  .switch { min-height: 34px; }
  /* 日志 details 撑满卡片剩余高度。details 的内容在 UA shadow slot 里，
     直接给 #logs 设 flex 不生效，用 ::details-content 命中那个内容盒承接弹性高度。 */
  #logBox { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #logBox::details-content { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  #logBox:not([open])::details-content { display: none; }
  #logBox summary { flex: none; min-height: 30px; font-size: 13px; }
  .logbody { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .logtools { flex: none; margin-top: 5px; gap: 6px; }
  .logtools input { min-height: 34px; }
  #logs { flex: 1 1 0; height: 0; min-height: 0; max-height: none; margin-top: 8px;
          padding: 10px; font-size: 12px; }
  .tblwrap { flex: 1; min-height: 0; max-height: none; }
  table.tbl { font-size: 12px; }
  table.tbl th, table.tbl td { padding: 7px 8px; }
  .tbl-empty { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {

}

<style id="glass-skin">
/* ============================================================
   GLASS 皮肤（2026-10-31）：Apple 玻璃拟态覆盖层。
   只改视觉，不动布局与 JS：本块追加在原样式之后，靠层叠顺序
   覆盖表面/边框/阴影；栅格、媒体查询、容器查询全部原样继承。
   手法：半透明表面 + backdrop-filter 磨砂 + 内侧高光描边，
   背后铺一层缓慢漂移的彩色光斑——玻璃的"透"全靠背后有内容。
   ============================================================ */
html[data-theme="dark"] {
  --bg:        transparent;
  --card:      rgba(255,255,255,.07);
  --raised:    rgba(255,255,255,.10);
  --border:    rgba(255,255,255,.14);
  --border-hi: rgba(255,255,255,.30);
  --shadow:    0 8px 32px rgb(2 6 23 / 45%), inset 0 1px 0 rgb(255 255 255 / 12%);
}
html[data-theme="light"] {
  --bg:        transparent;
  --card:      rgba(255,255,255,.55);
  --raised:    rgba(255,255,255,.45);
  --border:    rgba(255,255,255,.65);
  --border-hi: rgba(255,255,255,.9);
  --shadow:    0 8px 32px rgb(31 38 135 / 14%), inset 0 1px 0 rgb(255 255 255 / 80%);
}

/* 背景光斑：固定层，不随内容滚动；明暗两套浓度 */
body { background: #0a0f1e; }
html[data-theme="light"] body { background: linear-gradient(160deg, #d7e1fa 0%, #e6e1fb 45%, #f6e6f1 100%); }
body::before {
  content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38% 42% at 18% 12%, rgb(96 118 255 / 55%), transparent 60%),
    radial-gradient(34% 40% at 85% 18%, rgb(186 104 255 / 45%), transparent 60%),
    radial-gradient(40% 44% at 70% 88%, rgb(45 212 191 / 35%), transparent 62%),
    radial-gradient(36% 40% at 12% 82%, rgb(244 114 182 / 30%), transparent 60%);
  filter: blur(60px) saturate(140%);
  animation: glassdrift 36s ease-in-out infinite alternate;
}
html[data-theme="light"] body::before {
  background:
    radial-gradient(38% 42% at 18% 12%, rgb(96 118 255 / 62%), transparent 60%),
    radial-gradient(34% 40% at 85% 18%, rgb(186 104 255 / 50%), transparent 60%),
    radial-gradient(40% 44% at 70% 88%, rgb(45 212 191 / 44%), transparent 62%),
    radial-gradient(36% 40% at 12% 82%, rgb(244 114 182 / 38%), transparent 60%);
}
@keyframes glassdrift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(2%, -1.5%, 0) scale(1.06); }
  100% { transform: translate3d(-2%, 1.5%, 0) scale(1.02); }
}

/* ---------- 玻璃表面：卡片与 KPI ---------- */
.card, .kpi {
  background: linear-gradient(135deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%));
  -webkit-backdrop-filter: blur(22px) saturate(170%);
  backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid rgb(255 255 255 / 14%);
  box-shadow: 0 8px 32px rgb(2 6 23 / 38%), inset 0 1px 0 rgb(255 255 255 / 12%);
  border-radius: 20px;
}
html[data-theme="light"] .card, html[data-theme="light"] .kpi {
  background: linear-gradient(135deg, rgb(255 255 255 / 58%), rgb(255 255 255 / 30%));
  border-color: rgb(255 255 255 / 85%);
  box-shadow: 0 8px 32px rgb(31 38 135 / 18%), inset 0 1px 0 rgb(255 255 255 / 90%);
}

/* ---------- 玻璃表面：控件 ---------- */
.btn-ghost, .btn-sm, .icon-btn, .ksel {
  background: rgb(255 255 255 / 8%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgb(255 255 255 / 16%);
}
html[data-theme="light"] .btn-ghost, html[data-theme="light"] .btn-sm,
html[data-theme="light"] .icon-btn, html[data-theme="light"] .ksel {
  background: rgb(255 255 255 / 42%);
  border-color: rgb(255 255 255 / 85%);
}
.btn-primary {
  background-image: linear-gradient(135deg, #6d8fff, #8b5cf6);
  border-color: rgb(255 255 255 / 25%);
  box-shadow: 0 4px 18px rgb(109 143 255 / 45%), inset 0 1px 0 rgb(255 255 255 / 30%);
}
.btn-primary:hover:not(:disabled) {
  background-image: linear-gradient(135deg, #7f9dff, #9a6ffb);
}
.btn-sm.on {
  background: color-mix(in oklab, var(--warn) 26%, rgb(255 255 255 / 8%));
}

/* 分段控件：整条也是玻璃，选中格更亮 */
.seg {
  background: rgb(255 255 255 / 7%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgb(255 255 255 / 14%);
  border-radius: 14px;
}
.seg-btn.on {
  background: rgb(255 255 255 / 16%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 22%);
}
html[data-theme="light"] .seg { background: rgb(255 255 255 / 40%); border-color: rgb(255 255 255 / 85%); }
html[data-theme="light"] .seg-btn.on { background: #fff; box-shadow: 0 2px 8px rgb(31 38 135 / 15%); }

/* 顶栏分隔线、logo */
.top { border-bottom-color: rgb(255 255 255 / 12%); }
html[data-theme="light"] .top { border-bottom-color: rgb(255 255 255 / 70%); }
.logo {
  background: linear-gradient(135deg, #6d8fff, #8b5cf6);
  box-shadow: 0 0 0 1px rgb(255 255 255 / 25%), 0 4px 18px rgb(109 143 255 / 50%);
}

/* ---------- 玻璃表面：日志、表格、输入、轨道、标签 ---------- */
#logs {
  background: rgb(0 0 0 / 22%);
  border-color: rgb(255 255 255 / 10%);
}
html[data-theme="light"] #logs { background: rgb(255 255 255 / 38%); border-color: rgb(255 255 255 / 80%); }
.logtools input {
  background: rgb(255 255 255 / 8%);
  border: 1px solid rgb(255 255 255 / 16%);
}
html[data-theme="light"] .logtools input { background: rgb(255 255 255 / 55%); border-color: rgb(255 255 255 / 80%); }
table.tbl th { background: rgb(15 20 34 / 55%); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
html[data-theme="light"] table.tbl th { background: rgb(248 250 253 / 80%); }
table.tbl tbody tr:hover { background: rgb(255 255 255 / 6%); }
html[data-theme="light"] table.tbl tbody tr:hover { background: rgb(255 255 255 / 55%); }
.bar { background: rgb(255 255 255 / 10%); }
html[data-theme="light"] .bar { background: rgb(31 38 135 / 8%); }
.track { background: rgb(255 255 255 / 12%); }
html[data-theme="light"] .track { background: rgb(31 38 135 / 10%); }
.tag { background: rgb(255 255 255 / 8%); }
html[data-theme="light"] .tag { background: rgb(31 38 135 / 6%); }

/* toast 也是玻璃 */
.toast {
  background: rgb(17 24 39 / 78%);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%);
  border: 1px solid rgb(255 255 255 / 16%);
  box-shadow: 0 8px 32px rgb(2 6 23 / 50%);
}
html[data-theme="light"] .toast {
  background: rgb(255 255 255 / 68%);
  border-color: rgb(255 255 255 / 85%);
  box-shadow: 0 8px 32px rgb(31 38 135 / 18%);
}

/* 告警/横幅的描边在玻璃上稍微提亮，保持可读 */
.alert, .banner { border-color: color-mix(in oklab, var(--warn) 55%, transparent); }
.alert.crit, .banner { border-color: color-mix(in oklab, var(--danger) 60%, transparent); }

/* ---------- 鼠标聚光（spotlight）：卡片内跟随光标的高光 + 全局光斑 ----------
   坐标由页尾的 rAF 脚本写入：--mx/--my 逐卡片（驱动 ::after 高光），
   --gx/--gy 在根节点（驱动 body::after 的整页光斑）。未移动前藏在视口外。 */
.card, .kpi { position: relative; }
.card::after, .kpi::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%),
              rgb(255 255 255 / 14%), transparent 45%);
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.card:hover::after, .kpi:hover::after { opacity: 1; }
html[data-theme="light"] .card::after, html[data-theme="light"] .kpi::after {
  background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%),
              rgb(96 118 255 / 12%), transparent 45%);
}
/* 下拉选项：原生弹层不吃玻璃半透明底，浅色主题下会浅字浅底——
   根节点声明 color-scheme 并按主题给 option 不透明底色 */
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
/* 原生 option 弹层是系统渲染，做不了玻璃——自绘玻璃下拉替代（.ksel 原生件隐藏当数据源） */
.gsel-native { display: none !important; }
.gsel-wrap { position: relative; display: inline-flex; }
.gsel-btn {
  display: inline-flex; align-items: center; gap: 7px; max-width: 220px;
  min-height: 34px; padding: 5px 10px; font: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--fg); cursor: pointer;
  background: rgb(255 255 255 / 8%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgb(255 255 255 / 16%); border-radius: 12px;
}
html[data-theme="light"] .gsel-btn { background: rgb(255 255 255 / 42%); border-color: rgb(255 255 255 / 85%); }
.gsel-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gsel-btn .car { flex: none; opacity: .55; font-size: 10px; }
.gsel-list {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 100%;
  padding: 5px; border-radius: 14px;
  background: linear-gradient(135deg, rgb(38 48 78 / 72%), rgb(24 32 54 / 66%));
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid rgb(255 255 255 / 18%);
  box-shadow: 0 12px 36px rgb(2 6 23 / 55%), inset 0 1px 0 rgb(255 255 255 / 14%);
}
html[data-theme="light"] .gsel-list {
  background: linear-gradient(135deg, rgb(255 255 255 / 88%), rgb(255 255 255 / 70%));
  border-color: rgb(255 255 255 / 90%);
  box-shadow: 0 12px 36px rgb(31 38 135 / 20%), inset 0 1px 0 rgb(255 255 255 / 90%);
}
.gsel-item {
  padding: 8px 12px; border-radius: 9px; white-space: nowrap;
  color: var(--fg); font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.gsel-item:hover { background: rgb(255 255 255 / 13%); }
.gsel-item.on { background: rgb(255 255 255 / 19%); }
html[data-theme="light"] .gsel-item:hover { background: rgb(31 38 135 / 8%); }
html[data-theme="light"] .gsel-item.on { background: rgb(96 118 255 / 16%); }

body::after {
  content: ""; position: fixed; z-index: -1; pointer-events: none;
  left: var(--gx, -9999px); top: var(--gy, -9999px);
  width: 520px; height: 520px; margin: -260px 0 0 -260px;
  background: radial-gradient(circle, rgb(120 140 255 / 16%), transparent 60%);
}
html[data-theme="light"] body::after {
  background: radial-gradient(circle, rgb(96 118 255 / 16%), transparent 60%);
}
</style>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">H</div>
      <div>
        <h1 data-i18n="app.title">HALOGEN 控制台</h1>
        <p class="state" id="stateLine" aria-live="polite">
          <span class="dot" id="dot"></span><span id="stateText" data-i18n="state.connecting">正在连接…</span>
        </p>
      </div>
    </div>
    <!-- 告警条：阈值越界才出现，紧跟标题右侧，正常状态不占位 -->
    <div class="alerts" id="alerts" aria-live="polite"></div>
    <div class="spacer"></div>
    <div class="actions">
      <!-- 引擎切换：六个引擎都要独占本机内存，同一时刻只能跑一个 -->
      <div class="seg" id="engineSeg" role="group" data-i18n-aria="eng.pick">
        <button class="seg-btn" id="engBtn-halogen" data-engine="halogen">halogen</button>
        <button class="seg-btn" id="engBtn-kyojin"  data-engine="kyojin">kyojin</button>
        <button class="seg-btn" id="engBtn-strata"  data-engine="strata">strata</button>
        <button class="seg-btn" id="engBtn-gsqhalo" data-engine="gsqhalo">gsqhalo</button>
        <button class="seg-btn" id="engBtn-hipfire" data-engine="hipfire">hipfire</button>
        <button class="seg-btn" id="engBtn-gufo"    data-engine="gufo">gufo</button>
      </div>
      <!-- kyojin 的模型子选择（GLM/Qwen 两条车道互斥；只在该引擎被选中时显示） -->
      <select class="ksel" id="kVariant" hidden data-i18n-aria="kv.pick"></select>
      <!-- halogen 的检查点子选择（破限/标准 .hgn 文件；同一单元换 HALOGEN_CHECKPOINT
           行，与 kyojin 变体同规则：只改"启动/重启哪一个"，点按钮才生效） -->
      <select class="ksel" id="hCheckpoint" hidden data-i18n-aria="cp.pick"></select>
      <button class="btn btn-primary" id="bStart" data-i18n="btn.start">启动模型</button>
      <button class="btn btn-ghost"   id="bRestart" data-i18n="btn.restart">重启模型</button>
      <button class="btn btn-danger"  id="bStop" data-i18n="btn.stop">停止模型</button>
    </div>
    <button class="icon-btn" id="langBtn" title="切换语言 / Switch language">EN</button>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"
            data-i18n-title="theme.toggle" data-i18n-aria="theme.toggle">◐</button>
  </div>

  <div class="banner" id="banner" role="alert">
    <span class="dot err"></span>
    <span id="bannerText" data-i18n="banner.lost">与控制台服务失去连接，正在重试…</span>
  </div>

  <main class="main">
   <div class="col"><!-- 左栏：KPI + 资源 + 请求历史 -->
  <!-- KPI 层：一眼看完最重要的三个数 -->
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-label"><span data-i18n="kpi.prefill">预填充速度</span><span class="when" data-i18n="kpi.lastDone" data-i18n-title="kpi.lastDoneTip">最近完成</span></div>
      <div class="kpi-val num" id="kPre">—<small>tok/s</small></div>
      <div class="kpi-foot">
        <span><span data-i18n="kpi.avg">平均</span> <span class="num" id="kPreAvg">—</span></span>
        <span class="peak"><span data-i18n="kpi.peak">峰值</span> <span class="num" id="kPrePeak">—</span></span>
      </div>
      <div class="spark-empty" id="spPre"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span data-i18n="kpi.decode">输出速度</span><span class="when" data-i18n="kpi.lastDone" data-i18n-title="kpi.lastDoneTip">最近完成</span></div>
      <div class="kpi-val num" id="kDec">—<small>tok/s</small></div>
      <div class="kpi-foot">
        <span><span data-i18n="kpi.avg">平均</span> <span class="num" id="kDecAvg">—</span></span>
        <span class="peak"><span data-i18n="kpi.peak">峰值</span> <span class="num" id="kDecPeak">—</span></span>
      </div>
      <div class="spark-empty" id="spDec"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span data-i18n="kpi.engine">引擎</span></div>
      <div class="kpi-val dim num" id="kVer">—</div>
      <div class="kpi-note" id="kUpdate">—</div>
      <div class="kpi-foot">
        <span id="kEngineState">—</span>
        <span class="tag" id="kReqTag" hidden><span data-i18n="kpi.req">请求</span> <b id="kReq">0</b></span>
      </div>
    </div>
  </div>

  <!-- 分析层：活动类看趋势（sparkline），容量类看水位（进度条） -->
  <div class="card res-card">
    <h2><span data-i18n="res.title">系统资源</span> <span class="hint" id="sampleStamp" data-i18n="res.waiting">等待采样…</span></h2>
    <div class="res" id="res"></div>
  </div>

  <!-- 请求历史：服务端按每次完成的请求记录一行 -->

        <thead>
          <tr>

        </thead>
        <tbody id="histBody"><tr><td colspan="5" class="tbl-empty" data-i18n="hist.empty">暂无已完成请求</td></tr></tbody>
      </table>
    </div>
  </div>
   </div><!-- /左栏 -->

   <div class="det"><!-- 右栏：明细 + 设置与日志 -->
    <div class="card">
      <h2 data-i18n="svc.title">模型服务</h2>
      <div class="kv"><span data-i18n="svc.engine">引擎</span><b id="dEng">—</b></div>

   ============================================================ */
(() => {
  const saved = localStorage.getItem('halogenTheme');
  const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = saved || sys;
  document.getElementById('themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('halogenTheme', next);
  };
})();

   六个引擎各需独占本机大半内存/显存，永远互斥运行——

  hipfire: { label: 'hipfire' },

  gufo:    { label: 'gufo' },

const ENG_KEY = 'halogenEngineSel';

/* 用户没显式选过时，首次状态刷新会自动跟随"正在运行"的那个引擎；

/* kyojin 的模型子选择：同一套"跟随但点过就固定"规则——没显式选过时跟随正在
   跑的变体，选过之后不再自动切。选择记在 localStorage，跨刷新保留。 */
const KVAR_KEY = 'halogenKyojinVariant';

const savedVar = localStorage.getItem(KVAR_KEY);
let KVAR = variantsOf('kyojin').some(v => v.key === savedVar) ? savedVar : 'qwen';
let kvarPinned = !!savedVar;
function variantLabel(k) {

/* halogen 的检查点子选择（.hgn 文件，破限/标准）：与 kyojin 变体同一套规则——
   没显式选过时跟随正在跑的实例（停了则跟随单元文件=下次启动会用的那个），
   点过就固定。选项来自后端状态 d.checkpoints（服务端注册表是唯一事实源）。 */
const CPV_KEY = 'halogenCheckpoint';
let CPV = localStorage.getItem(CPV_KEY) || null;
let cpvPinned = !!localStorage.getItem(CPV_KEY);
function cpLabel(k) {
  if (!k) return '—';
  return I18N['cp.' + k] ? t('cp.' + k) : k;
}

const api = path => path + (path.includes('?') ? '&' : '?') + 'engine=' + SEL

function t(key, params) {
  const entry = I18N[key];
  let s = entry ? (entry[LANG] != null ? entry[LANG] : entry.zh) : key;

}

/* 缺翻译的枚举值（如 systemd 冒出个没见过的状态）原样显示，不显示键名 */

/* ------------------------------------------------------------
   sparkline：32px 内的折线 + 淡填充。
   百分比类固定 0–100 以便横向可比；速率类按自身峰值归一，
   只表达形状不表达绝对值（这是 sparkline 的正确用法）。
   ------------------------------------------------------------ */
function spark(values, colorClass, fixedMax) {
  const v = (values || []).filter(x => typeof x === 'number' && isFinite(x));
  if (v.length < 2) return '';
  const W = 100, H = 30;
  const max = fixedMax != null ? fixedMax : Math.max(...v);
  const min = fixedMax != null ? 0 : Math.min(...v);
  const span = Math.max(max - min, 1e-6);
  const x = i => (i / (v.length - 1)) * W;
  const y = p => H - ((Math.max(min, Math.min(max, p)) - min) / span) * H;
  const d = v.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(p).toFixed(2)}`).join(' ');
  return `<svg class="spark ${colorClass}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path class="spark-area" d="${d} L${W},${H} L0,${H} Z"></path>
    <path class="spark-line" d="${d}"></path></svg>`;
}

function toast(text, ok) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'toast show' + (ok ? '' : ' bad');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 3600);
}

const fmtUp = s => s == null ? '—' :
  (s < 60 ? t('up.sec', { n: s })
   : s < 3600 ? t('up.min', { m: Math.floor(s / 60), s: s % 60 })
   : t('up.hour', { h: Math.floor(s / 3600), m: Math.floor(s % 3600 / 60) }));
const pct = (v, d = 1) => v == null ? '—' : v.toFixed(d);
const barClass = p => p == null ? '' : p >= 90 ? 'danger' : p >= 75 ? 'warn' : '';

/* ------------------------------------------------------------
   资源层渲染
   ------------------------------------------------------------ */
function resRow(o) {
  // o: {label, value, sub, barPct, spark, sparkClass, tags, title}
  const bar = o.barPct != null
    ? `<div class="bar"><i class="${barClass(o.barPct)}" style="width:${Math.min(100, o.barPct)}%"></i></div>`
    : (o.spark || '');
  const tags = (o.tags || []).length
    ? `<div class="tags">${o.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';
  return `<div class="res-item"${o.title ? ` title="${o.title}"` : ''}>
    <div class="res-head"><span class="res-label">${o.label}</span><span class="res-val">${o.value}</span></div>
    ${bar}${tags}</div>`;
}

function renderRes(sys, hist) {
  const h = hist || {};
  const cpu = sys.cpu || {}, mem = sys.mem || {}, disk = sys.disk, gpu = sys.gpu;
  const rows = [];

  rows.push(resRow({
    label: t('res.cpu'),
    value: `${pct(cpu.percent)}%` + (cpu.temp_c != null ? ` <em>${cpu.temp_c}°C</em>` : ''),
    spark: spark(h.cpu, 'c-cpu', 100),
    tags: [
      cpu.freq_mhz != null ? t('res.avgGHz', { v: (cpu.freq_mhz / 1000).toFixed(2) }) : '',
      cpu.load1 != null ? t('res.load', { v: cpu.load1 }) : '',
    ].filter(Boolean),
  }));

  if (gpu) {
    rows.push(resRow({
      label: t('res.gpu'),
      value: `${pct(gpu.busy, 0)}%` + (gpu.temp_c != null ? ` <em>${gpu.temp_c}°C</em>` : ''),
      spark: spark(h.gpu, 'c-gpu', 100),
      tags: [
        gpu.power_w != null ? t('res.power', { v: gpu.power_w }) : '',
        gpu.sclk_mhz != null ? t('res.coreClk', { v: gpu.sclk_mhz }) : '',
        gpu.fclk_mhz != null ? t('res.memClk', { v: gpu.fclk_mhz }) : '',
      ].filter(Boolean),
    }));
  }

  // NPU：利用率口径与 GPU busy% 同源（amdxdna 记在客户端 fdinfo 的引擎忙碌时间），
  // 拿不到读数也没有 sysfs，全靠服务端两次采样求差 —— 这里只负责画。
  const npu = sys.npu;
  if (npu) {
    rows.push(npu.present ? resRow({
      label: t('res.npu'),
      value: `${pct(npu.busy, 0)}%`,
      spark: spark(h.npu, 'c-npu', 100),
      title: t('res.npuTip'),
      tags: [
        npu.mem_mb != null ? t('res.npuMem', { v: pct(npu.mem_mb, 0) }) : '',
        npu.clients != null ? t('res.npuClients', { n: npu.clients }) : '',
        npu.fw ? t('res.npuFw', { v: npu.fw }) : '',
      ].filter(Boolean),
    }) : resRow({
      label: t('res.npu'),
      value: t('res.npuOff'),
      spark: '',
      tags: [t('res.npuHint')],
    }));
  }

  rows.push(resRow({
    label: t('res.mem'),
    value: `${pct(mem.used_gb)} / ${pct(mem.total_gb)} <em>GB</em>`,
    barPct: mem.percent,
    tags: [
      t('res.used', { v: pct(mem.percent) }),
      t('res.avail', { v: pct(mem.avail_gb) }),
      mem.swap_used_gb ? `Swap <b>${pct(mem.swap_used_gb)}</b> GB` : 'Swap <b>0</b>',
    ],
  }));

  // 硬盘按"活动类"呈现：主轴是实时读写吞吐（模型读查找表时这里会明显抬头），
  // 容量降级成一个标签，仍然可见但不再占据主轴。
  const dio = sys.disk_io;
  if (dio && dio.read_mbs != null) {
    rows.push(resRow({
      label: t('res.disk'),
      value: t('res.io', { r: pct(dio.read_mbs, 2), w: pct(dio.write_mbs, 2) }),
      spark: spark(h.disk, 'c-disk'),
      tags: [
        t('res.iops', { v: dio.iops }),
        t('res.busy', { v: pct(dio.util_pct) }),
        disk ? t('res.capUsed', { v: pct(disk.percent) }) : '',
      ].filter(Boolean),
    }));
  } else if (dio || disk) {
    rows.push(resRow({
      label: t('res.disk'),
      value: dio ? t('res.sampling') : t('res.unavail'),
      spark: '',
      tags: disk ? [t('res.capUsed', { v: pct(disk.percent) }),
                    t('res.avail', { v: pct(disk.avail_gb) })] : [],
    }));
  }

  // 网络：主轴与硬盘同为"活动类"——主接口（默认路由那个）的实时吞吐；标签给
  // 接口/类型、IP、信号（WiFi）或协商速率（有线）；其余 up 的物理接口列进"另有"。
  const net = sys.net;
  if (net) {
    const ifs = net.ifaces || [];
    const prim = ifs.find(i => i.name === net.primary) || ifs[0];
    if (prim) {
      const tip = [
        t('res.netTip'),
        prim.ssid ? t('res.netSsid', { v: prim.ssid }) : '',
        net.gateway ? t('res.netGw', { v: net.gateway }) : '',
        prim.rx_gb != null ? t('res.netTotal', { r: pct(prim.rx_gb, 1), t: pct(prim.tx_gb, 1) }) : '',
      ].filter(Boolean).join(' · ');
      const ifTag = t('res.netIf', { n: prim.name, k: prim.kind === 'wifi' ? t('res.netWifi') : t('res.netEth') });
      const rateTag = prim.signal_dbm != null ? t('res.netSig', { v: prim.signal_dbm })
        : prim.bitrate_rx_mbps != null ? t('res.netRate', { v: prim.bitrate_rx_mbps })
        : prim.speed_mbps != null ? t('res.netRate', { v: prim.speed_mbps }) : '';
      const others = ifs.filter(i => i !== prim && i.up).map(i => i.name);
      if (prim.up) {
        const live = prim.rx_mbs != null;
        rows.push(resRow({
          label: t('res.net'),
          value: live ? t('res.netIo', { r: pct(prim.rx_mbs, 2), t: pct(prim.tx_mbs, 2) })
                      : t('res.sampling'),
          spark: live ? spark(h.net, 'c-net') : '',
          title: tip,
          tags: [ifTag,
                 prim.ipv4 ? t('res.netIp', { v: prim.ipv4 }) : '',
                 rateTag,
                 others.length ? t('res.netOthers', { n: others.join(', ') }) : '',
                ].filter(Boolean),
        }));
      } else {
        rows.push(resRow({
          label: t('res.net'), value: t('res.netDown'), spark: '', title: tip,
          tags: [ifTag, prim.ipv4 ? t('res.netIp', { v: prim.ipv4 }) : ''].filter(Boolean),
        }));
      }
    }
  }

  if (gpu) {
    const v = gpu.vram || {}, g = gpu.gtt || {};
    rows.push(resRow({
      label: t('res.vram'),
      value: `${pct(v.used_gb, 2)} / ${pct(v.total_gb, 2)} <em>GB</em>`,
      barPct: v.percent,
      // 进度条已表达"已用%"，标签改为说明这块显存本身的来源，不再重复百分比
      tags: [t('res.vramNote', { v: pct(v.total_gb, 2) })],
    }));
    rows.push(resRow({
      label: t('res.gtt'),
      value: `${pct(g.used_gb)} / ${pct(g.total_gb)} <em>GB</em>`,
      barPct: g.percent,
      tags: [
        t('res.gttNote'),
        t('res.avail', { v: pct((g.total_gb || 0) - (g.used_gb || 0)) }),
      ],
    }));
  }

  $('res').innerHTML = rows.join('');
}

   主刷新
   ------------------------------------------------------------ */
let failCount = 0;

/* ------------------------------------------------------------
   上游版本检查：只在打开/刷新页面时问一次服务端
   （服务端自己缓存 GitHub 查询），之后每秒的重绘只画已存结果。
   渲染里带签名去重，否则每秒重建一次 <a> 会把点击吃掉。
   ------------------------------------------------------------ */
let updateState = { phase: 'checking' };
let updateRendered = '';
let updateSeq = 0;

const verText = s => String(s == null ? '' : s).replace(/^v/i, '');

function renderUpdate() {
  const el = $('kUpdate'), u = updateState;
  const sig = [LANG, u.phase, u.kind, u.local, u.latest, u.update_available,
               u.behind_by, u.ahead_by, u.error, u.supported].join('|');
  if (sig === updateRendered) return;
  updateRendered = sig;

  el.className = 'kpi-note';
  el.removeAttribute('title');
  const repo = u.repo || '';

  if (u.phase === 'checking') { el.textContent = t('upd.checking'); return; }
  if (u.phase === 'failed') {
    el.textContent = t('upd.failed');
    if (u.error) el.title = u.error;
    return;
  }
  // kyojin / strata：源码构建，跟上游默认分支比 git 提交（strata 另自报版本号）
  if (u.kind === 'commit') {
    const tipKey = u.engine === 'strata' ? 'upd.commitTipStrata' : 'upd.commitTip';
    if (!u.supported || !u.local) {
      el.textContent = t('upd.noCheck');
      if (u.error) el.title = u.error;
      return;
    }
    if (u.error || u.behind_by == null) {
      el.textContent = t('upd.commitUnknown');
      el.title = (u.error ? u.error + ' · ' : '') + t(tipKey, { repo });
      return;
    }
    if (u.update_available) {
      el.innerHTML = t('upd.commitBehind', { n: u.behind_by }) +
        ` <a href="${u.compare_url || ('https://github.com/' + repo)}" target="_blank"`
        + ` rel="noopener" title="${t('upd.commitOpen')}">↗</a>`;
      el.classList.add('upd-new');
    } else if (u.ahead_by) {
      el.textContent = t('upd.commitAhead', { n: u.ahead_by });
    } else {
      el.textContent = t('upd.commitCurrent');
    }
    el.title = t(tipKey, { repo });
    return;
  }
  if (u.supported === false) {          // 其它没有版本接口的本地构建
    el.textContent = t('upd.noCheck');
    el.title = t('upd.tipLocal', { repo });
    return;
  }
  if (!u.local) {                       // 引擎没起来：无从比较，只报上游最新
    el.textContent = t('upd.upstream', { v: verText(u.latest) || '?' });
    el.title = t('upd.tip', { repo });
    return;
  }
  if (u.update_available) {
    el.innerHTML = t('upd.available', { v: verText(u.latest) }) +
      ` <a href="https://github.com/${repo}/tags" target="_blank" rel="noopener"`
      + ` title="${t('upd.open')}">↗</a>`;
    el.classList.add('upd-new');
    el.title = t(u.engine === 'hipfire' ? 'upd.tipNewHipfire' : 'upd.tipNew');
  } else {
    el.textContent = t('upd.current', { v: verText(u.local) });
    el.title = t('upd.tip', { repo });
  }
}

async function checkUpdate() {
  // 切换引擎/首次自动跟随时会连发两次查询：只认最后一次，防止先发的
  // 旧引擎结果后到、把新引擎的卡片覆盖掉。
  const seq = ++updateSeq;
  try {
    const d = await getJson(api('/api/update'));
    if (seq !== updateSeq) return;
    updateState = d.error ? { phase: 'failed', error: d.error, ...d } : { phase: 'done', ...d };
  } catch (e) {
    if (seq !== updateSeq) return;
    updateState = { phase: 'failed', error: e.message };
  }
  renderUpdate();
}

function renderKpis(d) {
  const m = d.metrics, hist = (d.history && d.history.rates) || [];
  // 引擎卡片的主值：halogen 显示引擎自报版本号；kyojin/gsqhalo 是源码构建、显示 git 短提交号
  const key = d.engine_key || SEL;
  const head = (d.engine && d.engine.head)
    || (updateState.kind === 'commit' ? updateState.local : null);
  const srcBuild = key === 'kyojin' || key === 'gsqhalo';
  const verStr = srcBuild ? (head || key)
    : (d.engine && d.engine.version ? 'v' + d.engine.version : '—');
  // 有版本号就显示（gufo 的 /metrics 没有 requests_total，不能拿它当显示条件）
  $('kVer').textContent = verStr;
  if (!m) {
    $('kPre').innerHTML = '—<small>tok/s</small>';
    $('kDec').innerHTML = '—<small>tok/s</small>';
    $('kPreAvg').textContent = $('kDecAvg').textContent = '—';
    $('kPrePeak').textContent = $('kDecPeak').textContent = '—';
    $('spPre').innerHTML = '';
    $('spDec').innerHTML = '';
    renderUpdate();
    $('kEngineState').textContent = d.unit.active === 'active' ? t('kpi.loading') : t('kpi.notRunning');
    $('kReqTag').hidden = true;
    return;
  }
  $('kPre').innerHTML = (m.prefill_now == null ? '—' : m.prefill_now.toFixed(1)) + '<small>tok/s</small>';
  $('kDec').innerHTML = (m.decode_now == null ? '—' : m.decode_now.toFixed(1)) + '<small>tok/s</small>';
  $('kPreAvg').textContent = m.prefill_avg == null ? '—' : m.prefill_avg.toFixed(1);
  $('kDecAvg').textContent = m.decode_avg == null ? '—' : m.decode_avg.toFixed(1);
  $('kPrePeak').textContent = m.prefill_peak == null ? '—' : m.prefill_peak.toFixed(1);
  $('kDecPeak').textContent = m.decode_peak == null ? '—' : m.decode_peak.toFixed(1);

  const busy = (m.processing || 0) > 0;
  renderUpdate();
  // requests_total 为 null 的引擎（gsqhalo 的 llama.cpp 不暴露请求计数）不硬凑 0
  $('kEngineState').innerHTML = busy
    ? `<span class="dot load" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${t('kpi.generating', { n: m.processing })}`
    : `<span class="dot on" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>`
      + (m.requests_total == null ? t('svc.isReady')
                                  : t('kpi.reqCount', { n: m.requests_total || 0 }));

  // 吞吐趋势：把每次完成的请求画成两条 sparkline
  const sp = hist.filter(r => r.p != null).map(r => r.p);
  const sd = hist.filter(r => r.d != null).map(r => r.d);
  const e1 = $('spPre'), e2 = $('spDec');
  const h1 = sp.length >= 2 ? spark(sp, 'c-cpu') : '';
  const h2 = sd.length >= 2 ? spark(sd, 'c-ok') : '';
  e1.innerHTML = h1;
  e2.innerHTML = h2;
}

function renderDetail(d) {
  const u = d.unit || {}, e = d.engine || {}, m = d.metrics;
  const key = d.engine_key || SEL;
  $('dEng').textContent = (ENGINES[key] ? ENGINES[key].label : key)
    + (e.model ? ' · ' + e.model : '');
  // halogen 有破限/标准两个 .hgn 档位：模型名相同，把在跑的检查点拼在后面才能区分
  $('dModel').textContent = (e.model || '—')
    + (key === 'halogen' && d.checkpoint_running ? ' · ' + cpLabel(d.checkpoint_running) : '');
  $('dUnit').textContent = unitLabel(u.active);
  $('dReady').textContent = e.ready ? t('svc.isReady')
    : (e.status === 'engine_unresponsive' ? t('svc.unresponsive') : (e.status || '—'));
  $('dVis').textContent = e.vision == null ? '—' : (e.vision ? t('svc.on') : t('svc.off'));
  // halogen：KV 池位置 / 槽位数；kyojin：/slots 里的上下文窗口（无槽位概念）
  $('dPool').textContent = e.kv_pool
    ? (e.slots ? `${e.kv_pool} / ${e.slots}` : String(e.kv_pool)) : '—';
  $('dUp').textContent = fmtUp(u.uptime_s);
  // 这两个率只有采集到它们的那台引擎才有意义，串台时宁可不显示
  const mine = m && (!m.engine || m.engine === key) ? m : null;
  const isHip = key === 'hipfire';
  const isGufo = key === 'gufo';
  const dl = $('dDraftLabel');
  if (dl) dl.textContent = isHip ? t('svc.draftTau') : t('svc.draft');
  if (isHip && mine && mine.draft_tau != null) {
    $('dDraft').textContent = 'τ ' + mine.draft_tau.toFixed(2);
    $('dDraft').title = t('svc.draftTauTip');
  } else {
    $('dDraft').textContent = mine && mine.draft_accept_pct != null ? mine.draft_accept_pct.toFixed(1) + '%' : '—';
    $('dDraft').title = '';
  }
  $('dCache').textContent = mine && mine.cache_hit_pct != null ? mine.cache_hit_pct.toFixed(1) + '%' : '—';
  if (!$('bootToggle').disabled) $('bootToggle').checked = (u.enabled === 'enabled');

  // 页缓存余量：halogen 用 contiguous 2 MiB blocks；hipfire 用启动日志的
  // free_after_weights（"权重后可用"）；gufo 用 load_completed 的 host_available。
  const hl = $('dHeadLabel');
  if (hl) hl.textContent = isHip ? t('svc.headHipfire')
    : isGufo ? t('svc.headGufo') : t('svc.headroom');
  const hr = d.headroom, hb = $('dHead');
  if (hr && hr.gib != null) {
    hb.textContent = hr.blocks != null
      ? t('svc.headVal', { gib: hr.gib.toFixed(1), n: hr.blocks })
      : isGufo
        ? t('svc.headValGufo', { gib: hr.gib.toFixed(1) })
        : t('svc.headValHipfire', { gib: hr.gib.toFixed(1) });
    hb.style.color = hr.gib < 8 ? 'var(--danger)' : hr.gib < 10 ? 'var(--warn)' : '';
  } else {
    hb.textContent = '—';
    hb.style.color = '';
  }

  /* 顶栏状态灯描述"正在运行的那个引擎"——它可能与药丸里选中的不同
     （比如选中 halogen 查看时 kyojin 在跑），名字写在前面避免误读。 */
  const active = d.active_engine;
  const au = active && d.units ? d.units[active] : null;
  const ae = active && d.engine_states ? (d.engine_states[active] || {}) : null;
  const nm = active ? (ENGINES[active] ? ENGINES[active].label : active) : '';
  let cls = 'dot', text;
  if (active && au) {
    const inflight = (m && m.processing) || (ae && ae.busy ? 1 : 0);
    if (au.active === 'activating' || (au.active === 'active' && ae && !ae.ready)) {
      if (au.active === 'active' && ae && ae.status === 'engine_unresponsive') {
        cls += ' err'; text = `${nm} · ${t('state.unresponsive')}`;
      } else {
        cls += ' load'; text = `${nm} · ${t('state.loadingModel')}`;
      }
    } else if (au.active === 'active' && ae && ae.ready) {
      cls += ' on'; text = `${nm} · ` + t('state.running', { v: ae.version || ae.model || '?' })
        + (inflight ? t('state.inflight', { n: inflight }) : '');
    } else if (au.active === 'failed') {
      cls += ' err'; text = `${nm} · ${t('state.startFail')}`;
    } else if (au.active === 'deactivating') {
      cls += ' load'; text = `${nm} · ${t('unit.deactivating')}`;
    } else { text = t('state.stopped'); }
  } else { text = t('state.stopped'); }
  $('dot').className = cls;
  const autostart = au ? au.enabled === 'enabled' : u.enabled === 'enabled';
  $('stateText').textContent = text + (autostart ? t('state.autostart') : '');
  $('stateText').title = (active && au && au.active === 'active' && ae && ae.status === 'engine_unresponsive')
    ? t('state.unresponsiveTip') : '';

  const starting = (u.active === 'active' || u.active === 'activating');
  $('bStart').disabled = starting;
  $('bStart').title = starting ? t('state.alreadyRunning') : '';
  $('bRestart').disabled = (u.active !== 'active');
  $('bStop').disabled = (u.active !== 'active' && u.active !== 'activating' && u.active !== 'failed');
  if (actionPending) for (const id of ['bStart', 'bRestart', 'bStop']) $(id).disabled = true;
}

/* ------------------------------------------------------------
   引擎切换：药丸只改"看谁/操作谁"，不启停任何东西。
   启动/重启时服务端会先停另一个引擎（互斥由它保证）。
   ------------------------------------------------------------ */
function renderEnginePills(d) {
  const units = (d && d.units) || {};
  for (const key of Object.keys(ENGINES)) {
    const b = $('engBtn-' + key);
    b.classList.toggle('on', key === SEL);
    // 正在跑的引擎带绿点：选中另一个看时，一眼知道"活的是谁"
    const u = units[key] || {};
    b.classList.toggle('live', u.active === 'active' || u.active === 'activating');
    b.title = t('eng.pickOne', { k: ENGINES[key].label });
  }
}

function switchEngine(key) {
  if (key === SEL || actionPending) return;
  SEL = key;
  selPinned = true;
  localStorage.setItem(ENG_KEY, SEL);
  // 立刻丢掉旧引擎的详情，避免新引擎的卡片里残留上一个的数字
  S.unit = {}; S.engine = {}; S.engine_key = key;
  S.variant = null; S.variants = {};
  S.checkpoints = {}; S.checkpoint = null; S.checkpoint_running = null;
  updateRendered = ''; updateState = { phase: 'checking' };
  renderEnginePills(S);
  renderVariantSelect(S);
  renderCheckpointSelect(S);
  renderDetail(S);
  renderUpdate();
  checkUpdate();
  refreshSlow(); refreshFast(); loadLogs();
}
for (const key of Object.keys(ENGINES)) {
  $('engBtn-' + key).onclick = () => switchEngine(key);
}

/* ------------------------------------------------------------
   kyojin 模型子选择：只改"启动/重启哪个变体"，不主动启停任何东西；
   在跑的变体自动选中并跟随状态刷新（用户点过就固定，不再跟随）。
   ------------------------------------------------------------ */
function renderVariantSelect(d) {
  const sel = $('kVariant');
  const vars = variantsOf(SEL);
  sel.hidden = !vars.length;
  if (!vars.length) return;
  if (sel.dataset.eng !== SEL) {         // 选项只在引擎切换时重建，别打断展开中的下拉
    sel.dataset.eng = SEL;
    sel.innerHTML = vars.map(v => '<option value="' + v.key + '">' + v.label + '</option>').join('');
  }
  const running = vars.find(v => v.key === ((d && d.variant) || '')) || null;
  if (running && !kvarPinned) KVAR = running.key;
  sel.value = KVAR;
  sel.title = running ? t('kv.running', { m: running.label }) : t('kv.pick');
}
$('kVariant').onchange = (ev) => {
  KVAR = ev.target.value;
  kvarPinned = true;
  localStorage.setItem(KVAR_KEY, KVAR);
  renderVariantSelect(S);
  // 选中和在跑的不一致时提醒一句：切换要按"重启模型"（会先停掉当前模型）
  const running = SEL === 'kyojin' ? (S.variant || null) : null;
  if (running && running !== KVAR) toast(t('kv.pending', { m: variantLabel(KVAR) }), true);
};

/* ------------------------------------------------------------
   halogen 检查点子选择：只改"启动/重启用哪个 .hgn 文件"，不主动启停；
   在跑的实例自动选中并跟随（用户点过就固定），停着时跟随单元文件。
   ------------------------------------------------------------ */
function renderCheckpointSelect(d) {
  const sel = $('hCheckpoint');
  const keys = Object.keys((d && d.checkpoints) || {});
  sel.hidden = !keys.length;
  if (!keys.length) return;
  // 选项在引擎/语言切换时重建（语言决定标签文案）；别打断展开中的下拉
  const sig = SEL + '/' + LANG;
  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig;
    sel.innerHTML = keys.map(k => '<option value="' + k + '">' + cpLabel(k) + '</option>').join('');
  }
  const running = (d && d.checkpoint_running) || null;
  const file = (d && d.checkpoint) || null;
  const shown = keys.includes(running) ? running : (keys.includes(file) ? file : keys[0]);
  if (!cpvPinned || !keys.includes(CPV)) CPV = shown;
  sel.value = CPV;
  sel.title = running ? t('cp.running', { m: cpLabel(running) }) : t('cp.pick');
}
$('hCheckpoint').onchange = (ev) => {
  CPV = ev.target.value;
  cpvPinned = true;
  localStorage.setItem(CPV_KEY, CPV);
  renderCheckpointSelect(S);
  // 与在跑的实例不一致时提醒：切换要按"启动模型"或"重启模型"（都会先停当前实例）
  const running = (S && S.checkpoint_running) || null;
  if (running && running !== CPV) toast(t('cp.pending', { m: cpLabel(CPV) }), true);
};

/* ------------------------------------------------------------
   告警：只在阈值越界时出现，正常时这块 DOM 是空的、不占高度
   ------------------------------------------------------------ */
function renderAlerts(d) {
  const out = [];
  const hr = d.headroom;
  if (hr && hr.gib != null && hr.gib < 10) {
    out.push({
      crit: hr.gib < 8,
      html: t('alert.headroom', { gib: hr.gib.toFixed(1) }),
    });
  }
  const kv = (d.metrics || {}).kv_ratio_pct;
  if (kv != null && kv >= 90) {
    out.push({ crit: kv >= 97, html: t('alert.kv', { v: kv.toFixed(1) }) });
  }
  const mem = (d.sys || {}).mem;
  if (mem && mem.percent >= 92) {
    out.push({ crit: mem.percent >= 96,
      html: t('alert.mem', { v: mem.percent.toFixed(1), a: mem.avail_gb }) });
  }
  const disk = (d.sys || {}).disk;
  if (disk && disk.percent >= 90) {
    out.push({ crit: disk.percent >= 95,
      html: t('alert.disk', { v: disk.percent.toFixed(1), a: disk.avail_gb }) });
  }
  $('alerts').innerHTML = out.map(a =>
    `<div class="alert${a.crit ? ' crit' : ''}"><span class="dot ${a.crit ? 'err' : 'warn'}"></span>` +
    `<div>${a.html}</div></div>`).join('');
}

/* ------------------------------------------------------------
   请求历史：每个完成的请求一行，取最近 30 条
   ------------------------------------------------------------ */
function renderHistory(d) {
  const rs = ((d.history || {}).rates) || [];
  $('histHint').textContent = rs.length
    ? t('hist.hint', { n: Math.min(rs.length, 30), m: rs.length }) : '';
  const body = $('histBody');
  if (!rs.length) {
    body.innerHTML = `<tr><td colspan="5" class="tbl-empty">${t('hist.empty')}</td></tr>`;
    return;
  }
  const f = v => v == null ? '—' : v.toFixed(1);
  body.innerHTML = rs.slice(-30).reverse().map(r => {
    const clock = new Date(r.t * 1000).toLocaleTimeString(loc(), { hour12: false });
    return `<tr><td class="mono">${clock}</td><td>${r.pt ?? '—'}</td><td>${r.ct ?? '—'}</td>` +
           `<td class="mono">${f(r.p)}</td><td class="mono">${f(r.d)}</td></tr>`;
  }).join('');
}

/* 两条刷新通道共享的状态：快速通道填 sys/metrics/history，
   慢通道填 unit/engine/headroom 等结构字段，渲染函数统一读这个合并对象。 */
const S = { unit: {}, engine: {}, metrics: null, sys: {}, history: { sys: {}, rates: [] } };

/* 快速通道（1 秒）：只画会实时变的系统资源与速度数字。
   失败不打断——连接中断由慢通道负责显示横幅。 */
let fastBusy = false, slowBusy = false;
async function getJson(path) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const r = await fetch(path, {cache: 'no-store', signal: controller.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally { clearTimeout(timer); }
}
async function refreshFast() {
  if (fastBusy) return;
  fastBusy = true;
  try {
    const q = await getJson('/api/quick');
    Object.assign(S, {sys: q.sys || {}, metrics: q.metrics, history: q.history || S.history});
    // 独立渲染，速度卡片异常不应中断系统资源更新。
    renderRes(S.sys, S.history && S.history.sys);
    const age = Date.now() / 1000 - q.ts;
    $('sampleStamp').textContent = age < 3
      ? t('res.tick', { t: new Date(q.ts * 1000).toLocaleTimeString(loc()) })
      : t('res.lag', { n: Math.max(0, Math.floor(age)) });
    renderKpis(S);
    // 速度来自"正在跑的那个引擎"，选中的是另一个时把来源写在时间戳前面
    const at = q.metrics && q.metrics.measured_at;
    const src = q.metrics_engine && q.metrics_engine !== SEL ? q.metrics_engine + ' · ' : '';
    $('rateStamp').textContent = !q.metrics_ok ? t('hist.noRate')
      : at ? src + t('hist.settled', { t: new Date(at * 1000).toLocaleTimeString(loc()) })
      : src + t('hist.waiting');
  } catch (e) {
    $('sampleStamp').textContent = t('res.failed');
    console.error('快速刷新失败', e);
  } finally { fastBusy = false; }
}

async function refreshSlow() {
  if (slowBusy) return;
  slowBusy = true;
  try {
    const d = await getJson(api('/api/status'));
    if (failCount) { failCount = 0; $('banner').classList.remove('show'); }
    // 没选过引擎的访客：跟随正在运行的那个，省得先看到一张"已停止"的卡片
    if (!selPinned && d.active_engine && d.active_engine !== SEL) {
      SEL = d.active_engine;
      selPinned = true;
      updateRendered = ''; updateState = { phase: 'checking' };
      renderUpdate(); checkUpdate(); loadLogs();
      slowBusy = false;              // 本轮数据属于旧引擎，丢弃后立刻用新引擎重取
      return refreshSlow();
    }
    // 慢响应不得覆盖快速通道已经更新的资源、速度和历史。
    Object.assign(S, { unit: d.unit, engine: d.engine, headroom: d.headroom,
                       engine_key: d.engine_key, units: d.units,
                       variant: d.variant, variants: d.variants,
                       checkpoint: d.checkpoint, checkpoints: d.checkpoints,
                       checkpoint_running: d.checkpoint_running,
                       active_engine: d.active_engine, engine_states: d.engine_states });
    renderEnginePills(S);
    renderVariantSelect(S);
    renderCheckpointSelect(S);
    renderDetail(S);
    renderAlerts(S);
    renderHistory(S);
  } catch (err) {
    console.error('状态刷新失败', err);
    if (++failCount >= 2) {
      $('banner').classList.add('show');
      $('stateText').textContent = t('state.disconnected');
      $('dot').className = 'dot err';
    }
  } finally { slowBusy = false; }
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    // X-Lang 告诉服务端用哪种语言回报错信息（toast 里会原样显示）
    headers: { 'Content-Type': 'application/json', 'X-Lang': LANG },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

let actionPending = false;
for (const a of ['start', 'stop', 'restart']) {
  const btnId = 'b' + a[0].toUpperCase() + a.slice(1);
  $(btnId).onclick = async () => {
    if (actionPending) return;
    // 启动/重启会把在跑的其它引擎（或 kyojin 的另一个模型变体）先停掉——先问一句
    const from = [];
    for (const k of Object.keys(ENGINES)) {
      if (k === SEL) continue;
      const ou = (S.units || {})[k] || {};
      if (ou.active === 'active' || ou.active === 'activating') from.push(ENGINES[k].label);
    }
    const runningVar = SEL === 'kyojin' ? (S.variant || null) : null;
    if (runningVar && runningVar !== KVAR) from.push(variantLabel(runningVar));
    /* halogen：选了与在跑不同的检查点 → 启动/重启都会先停当前实例换 .hgn 文件 */
    const cpKeys = Object.keys((S && S.checkpoints) || {});
    const runningCp = (S && S.checkpoint_running) || null;
    if (cpKeys.length && runningCp && runningCp !== CPV) from.push(cpLabel(runningCp));
    const toName = variantsOf(SEL).length ? variantLabel(KVAR)
                 : (cpKeys.length ? cpLabel(CPV) : SEL);
    if ((a === 'start' || a === 'restart') && from.length &&
        !confirm(t('switch.confirm', { from: from.join(', '), to: toName }))) return;
    actionPending = true;
    renderDetail(S);
    const button = $(btnId);
    button.textContent = t('btn.' + a + 'ing');
    try {
      // 停止不带变体/检查点：服务端把该引擎的所有变体单元都停掉（"停止模型"就是停这个引擎）
      const r = await post('/api/action', Object.assign({ action: a, engine: SEL },
                                                        a === 'stop' ? {} : { variant: KVAR, checkpoint: CPV }));
      const stopped = [...(r.stopped_others || []).map(k => (ENGINES[k] || {}).label || k),
                       r.stopped_variant].filter(Boolean).join(', ');
      if (stopped) toast(t('toast.switched', { from: stopped, to: toName }), true);
      else if (a === 'stop') toast(t('toast.stop'), true);
      else if (r.checkpoint_switched) toast(t('toast.cpSwitch', { m: cpLabel(r.checkpoint) }), true);
      else toast(t(SEL === 'kyojin' ? 'toast.loadLong' : 'toast.' + a, { verb: t('verb.' + a) }), true);
    } catch (e) { toast(t('toast.fail', { verb: t('verb.' + a), msg: e.message }), false); }
    finally {
      actionPending = false;
      button.textContent = t('btn.' + a);
      renderDetail(S);
    }
    setTimeout(() => { refreshSlow(); refreshFast(); }, 900);
  };
}

$('bootToggle').onchange = async (ev) => {
  ev.target.disabled = true;
  try {
    // 启用点名当前变体（启用它会自动取消其余引擎/另一个变体的自启）；
    // 取消时不带变体：服务端会把该引擎所有变体单元的 self-start 都关掉。
    const r = await post('/api/boot', Object.assign({ enabled: ev.target.checked, engine: SEL },
                                                    ev.target.checked ? { variant: KVAR } : {}));
    const dis = [...(r.disabled_others || []).map(k => (ENGINES[k] || {}).label || k),
                 r.disabled_variant].filter(Boolean).join(', ');
    toast(ev.target.checked
      ? (dis ? t('toast.bootOnOther', { k: dis }) : t('toast.bootOn'))
      : t('toast.bootOff'), true);
  } catch (e) {
    toast(t('toast.setFail', { msg: e.message }), false);
    ev.target.checked = !ev.target.checked;
  } finally { ev.target.disabled = false; }
};

/* ------------------------------------------------------------
   实时日志：默认展开，随主循环一起刷新。
   标签页切到后台或折叠时暂停轮询，避免无谓地反复拉起 docker logs。
   ------------------------------------------------------------ */
const logActive = () => $('logBox').open && document.visibilityState === 'visible' && !logPaused;

let hidden = 0;
let logPaused = false;
let logRaw = [];          // 未经过滤的原始行，供过滤框反复筛选
let logLoaded = false;    // 首次成功取到日志前，空列表显示"加载中…"而不是"暂无日志"

/* 暂停按钮的文字随语言与自身状态变，所以单独一个同步点 */
function syncPauseBtn() {
  $('logPause').textContent = logPaused ? t('log.resume') : t('log.pause');
  $('logPause').title = t('log.pauseTip');
}

function renderLogs(lines) {
  const pre = $('logs');
  logRaw = lines;
  const q = ($('logFilter').value || '').trim();
  const shown = q ? lines.filter(l => l.includes(q)) : lines;
  // 用户没往上翻时跟随最新一行；翻上去了就不打扰他的阅读位置
  const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 28;
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  pre.innerHTML = shown.length
    ? shown.map(l => {
        let cls = '';
        if (/(ERROR|FAILED|failed|out of memory|refus)/.test(l)) cls = 'l-err';
        else if (/(WARNING|WARN|NOTE|cannot|could not)/.test(l)) cls = 'l-warn';
        else if (/(engine listening|listening on|ready)/.test(l)) cls = 'l-ok';
        return `<span class="${cls}">${esc(l)}</span>`;
      }).join('\n')
    : (q ? t('log.nomatch') : t(logLoaded ? 'log.empty' : 'log.loading'));
  if (stick && !q) pre.scrollTop = pre.scrollHeight;
  const clock = new Date().toLocaleTimeString(loc(), { hour12: false });
  $('logMeta').textContent = t('log.meta', { t: clock, n: shown.length }) +
    (q ? t('log.filtered', { n: lines.length }) : (hidden ? t('log.hidden', { n: hidden }) : ''));
  $('logDot').className = 'livedot' + (logActive() ? '' : ' paused');
}

async function loadLogs() {
  if (!logActive()) return;
  try {
    const d = await getJson(api('/api/logs'));
    if (!logActive()) return;
    hidden = d.hidden || 0;
    logLoaded = true;
    renderLogs(d.lines || []);
  } catch (e) {
    $('logMeta').textContent = t('log.readFailed');
    $('logDot').className = 'livedot paused';
  }
}

$('logFilter').addEventListener('input', () => renderLogs(logRaw));

$('logPause').onclick = () => {
  logPaused = !logPaused;
  syncPauseBtn();
  $('logPause').classList.toggle('on', logPaused);
  $('logPause').setAttribute('aria-pressed', String(logPaused));
  if (!logPaused) loadLogs(); else renderLogs(logRaw);
  $('logDot').className = 'livedot' + (logActive() ? '' : ' paused');
};

$('expStatus').onclick = () => { location.href = api('/api/export/status'); };
$('expLogs').onclick = () => { location.href = api('/api/export/logs'); };

$('logBox').addEventListener('toggle', () => {
  $('logDot').className = 'livedot' + (logActive() ? '' : ' paused');
  loadLogs();
});

/* 双通道定时器：快速 1 秒刷系统资源/速度，慢速 3 秒刷单元状态/告警/日志。
   标签页切到后台时全部暂停，回到前台立即补一次再重启，避免无人看时白跑。 */
let fastTimer = null, slowTimer = null;
function stopTimers() {
  if (fastTimer) clearInterval(fastTimer);
  if (slowTimer) clearInterval(slowTimer);
  fastTimer = slowTimer = null;
}
function startTimers() {
  stopTimers();
  fastTimer = setInterval(refreshFast, 1000);
  slowTimer = setInterval(() => { refreshSlow(); loadLogs(); }, 3000);
}

document.addEventListener('visibilitychange', () => {
  $('logDot').className = 'livedot' + (logActive() ? '' : ' paused');
  if (document.hidden) {
    stopTimers();
  } else {
    refreshSlow(); refreshFast(); loadLogs();
    startTimers();
  }
});

/* 切语言：先刷静态标记，再用内存里的状态立即重绘一遍动态文本，
   不等下一次轮询（否则会看到半中半英的一两秒）。浮点时间戳那类
   慢字段随后由 refreshFast 归位。 */
function applyLang(lang) {
  LANG = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyStatic();
  renderRes(S.sys, S.history && S.history.sys);
  renderKpis(S);
  renderEnginePills(S);
  renderAlerts(S);
  renderHistory(S);
  renderLogs(logRaw);
  if (failCount >= 2) {
    $('stateText').textContent = t('state.disconnected');
    $('dot').className = 'dot err';
  } else {
    renderDetail(S);
  }
  refreshFast(); refreshSlow(); loadLogs();
}

$('langBtn').onclick = () => applyLang(LANG === 'en' ? 'zh' : 'en');

applyStatic();
renderEnginePills(S);
refreshSlow();
refreshFast();
loadLogs();
checkUpdate();
startTimers();
</script>

<script>
/* 玻璃下拉：原生 <option> 弹层由系统渲染、无法磨砂，与玻璃主题割裂。
   这里把 select.ksel 藏起来当数据源（render* 照旧重建 option / 设 value），
   盖一个玻璃按钮 + 玻璃列表；点击项回写 sel.value 并派发 change，
   原有 onchange（CPV/KVAR 持久化、待切换提示）零改动照常工作。 */
(() => {
  const lists = [];
  const closeAll = (except) => lists.forEach(l => { if (l !== except) l.hidden = true; });
  function glassify(sel) {
    if (sel.dataset.glassified) return;
    sel.dataset.glassified = '1';
    sel.classList.add('gsel-native');
    const wrap = document.createElement('span');
    wrap.className = 'gsel-wrap';
    sel.replaceWith(wrap);
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'gsel-btn';
    btn.innerHTML = '<span class="lbl"></span><span class="car">▼</span>';
    const list = document.createElement('div');
    list.className = 'gsel-list'; list.hidden = true;
    wrap.append(btn, sel, list);
    lists.push(list);
    const sync = () => {
      wrap.style.display = sel.hidden ? 'none' : '';
      const o = sel.selectedOptions[0];
      btn.querySelector('.lbl').textContent = o ? o.textContent : '—';
      list.innerHTML = [...sel.options].map(op =>
        `<div class="gsel-item${op.selected ? ' on' : ''}" data-v="${op.value}">${op.textContent}</div>`).join('');
    };
    btn.onclick = (e) => { e.stopPropagation(); closeAll(list); list.hidden = !list.hidden; };
    list.onclick = (e) => {
      const it = e.target.closest('.gsel-item');
      if (!it) return;
      if (it.dataset.v !== sel.value) {
        sel.value = it.dataset.v;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
      list.hidden = true;
    };
    sel.addEventListener('change', sync);
    // render* 每 3s 直接改 sel.value / hidden，不触发事件——轻轮询兜底
    setInterval(sync, 400);
    sync();
  }
  document.querySelectorAll('select.ksel').forEach(glassify);
  document.addEventListener('click', () => closeAll());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
})();
</script>
<script>
/* 鼠标聚光：rAF 节流的 pointermove → 写 --mx/--my（悬停卡片内的高光位置）
   和 --gx/--gy（整页光斑）。只加坐标，不碰原有逻辑。 */
(() => {
  let mx = 0, my = 0, raf = 0;
  document.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const r = document.documentElement.style;
      r.setProperty('--gx', mx + 'px');
      r.setProperty('--gy', my + 'px');
      const el = document.elementFromPoint(mx, my);
      const card = el && el.closest ? el.closest('.card, .kpi') : null;
      if (card) {
        const b = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((mx - b.left) / b.width * 100).toFixed(2) + '%');
        card.style.setProperty('--my', ((my - b.top) / b.height * 100).toFixed(2) + '%');
      }
    });
  }, { passive: true });
})();
</script>
